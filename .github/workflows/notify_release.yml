name: Notify App Release via Firebase

on:
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  notify-users:
    name: Send FCM Push Notification
    runs-on: ubuntu-latest

    steps:
      - name: Generate Firebase Access Token
        id: auth
        shell: bash
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets['FIREBASE_SERVICE_ACCOUNT'] }}
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 - << 'EOF' > token.txt
          import json, os
          from google.oauth2 import service_account
          import google.auth.transport.requests

          key_data = json.loads(os.environ['SERVICE_ACCOUNT_JSON'])
          creds = service_account.Credentials.from_service_account_info(
              key_data,
              scopes=['https://www.googleapis.com/auth/firebase.messaging']
          )
          request = google.auth.transport.requests.Request()
          creds.refresh(request)
          print(creds.token)
          EOF
          echo "access_token=$(cat token.txt)" >> $GITHUB_OUTPUT
          echo "project_id=$(python3 -c "import json, os; print(json.loads(os.environ['SERVICE_ACCOUNT_JSON']).get('project_id', 'life-app-59'))")" >> $GITHUB_OUTPUT

      - name: Prepare Notification Payload
        shell: bash
        run: |
          cat << 'EOF' > payload.json
          {
            "message": {
              "topic": "app_updates",
              "notification": {
                "title": "تحديث جديد متوفر 🚀 (${{ github.event.release.tag_name || 'تحديث جديد' }})",
                "body": "تم إصدار نسخة جديدة من تطبيق Life، افتح التطبيق للتحميل والتثبيت."
              },
              "data": {
                "type": "update",
                "tag": "${{ github.event.release.tag_name || '' }}",
                "route": "update"
              },
              "android": {
                "priority": "high",
                "notification": {
                  "channel_id": "life_updates_channel",
                  "click_action": "FLUTTER_NOTIFICATION_CLICK"
                }
              }
            }
          }
          EOF

      - name: Send FCM Notification via HTTP v1 API
        shell: bash
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          echo "Sending notification for project: $PROJECT_ID"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @payload.json \
            "https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send")

          echo "FCM Response: $RESPONSE"

          if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "✅ Notification sent successfully to topic 'app_updates'!"
          else
            echo "❌ Failed to send notification"
            exit 1
          fi
