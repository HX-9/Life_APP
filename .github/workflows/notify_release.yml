name: Notify App Release via Firebase

on:
  release:
    types: [published]

jobs:
  notify-users:
    name: Send FCM Push Notification
    runs-on: ubuntu-latest

    steps:
      - name: Send Notification
        shell: bash
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets['FIREBASE_SERVICE_ACCOUNT'] }}
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 - << 'EOF'
          import json, os, requests
          from google.oauth2 import service_account
          import google.auth.transport.requests

          key_data = json.loads(os.environ['SERVICE_ACCOUNT_JSON'])
          creds = service_account.Credentials.from_service_account_info(
              key_data,
              scopes=['https://www.googleapis.com/auth/firebase.messaging']
          )
          creds.refresh(google.auth.transport.requests.Request())

          project_id = key_data.get("project_id", "life-app-59")
          url = f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send"
          
          payload = {
              "message": {
                  "topic": "app_updates",
                  "notification": {
                      "title": "تحديث جديد متوفر 🚀",
                      "body": "يتوفر إصدار جديد من تطبيق Life، افتح التطبيق للتحديث."
                  },
                  "android": {
                      "priority": "high",
                      "notification": {
                          "channel_id": "life_updates_channel"
                      }
                  }
              }
          }

          r = requests.post(url, headers={"Authorization": f"Bearer {creds.token}"}, json=payload)
          print(r.status_code, r.text)
          r.raise_for_status()
          EOF
